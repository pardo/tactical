<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1d21" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Tactical</title>
    <style>
      :root {
        --safe-t: env(safe-area-inset-top, 0px);
        --safe-r: env(safe-area-inset-right, 0px);
        --safe-b: env(safe-area-inset-bottom, 0px);
        --safe-l: env(safe-area-inset-left, 0px);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #111;
        color: #ddd;
        font: 13px system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* touch-action: none hands every gesture to our code (no browser pan/zoom). */
      #app { position: fixed; inset: 0; touch-action: none; }
      #app canvas { display: block; }
      #hud {
        position: fixed;
        top: calc(8px + var(--safe-t));
        left: calc(8px + var(--safe-l));
        pointer-events: none;
        white-space: pre;
        text-shadow: 0 1px 2px #000;
      }
      #toolbar {
        position: fixed;
        top: calc(8px + var(--safe-t));
        right: calc(8px + var(--safe-r));
        display: flex;
        gap: 8px;
      }
      #toolbar button {
        min-width: 44px;
        min-height: 44px;
        font-size: 18px;
        border-radius: 10px;
        border: 1px solid #444;
        background: rgba(30, 34, 40, 0.85);
        color: #eee;
        touch-action: manipulation;
      }
      #toolbar button:active { background: rgba(70, 80, 90, 0.9); }
      #help {
        position: fixed;
        bottom: calc(8px + var(--safe-b));
        left: calc(8px + var(--safe-l));
        right: calc(8px + var(--safe-r));
        text-align: center;
        opacity: 0.7;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="toolbar">
      <button id="btn-reset" title="Reset camera" aria-label="Reset camera">⌖</button>
      <button id="btn-fullscreen" title="Fullscreen" aria-label="Fullscreen">⛶</button>
    </div>
    <div id="help"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
